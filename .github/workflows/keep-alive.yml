name: Keep Alive Backend 🟢

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ASSA Backend Health Endpoint
        run: |
          curl -s -f https://assa-api.onrender.com/api/health || echo "Ping failed or backend is cold starting"
