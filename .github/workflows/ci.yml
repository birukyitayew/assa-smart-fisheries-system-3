name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assa
          POSTGRES_PASSWORD: assa
          POSTGRES_DB: assa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assa -d assa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://assa:assa@localhost:5432/assa
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install module deps
        run: npm run install:all

      - name: Prisma migrate and seed
        working-directory: backend
        run: npx prisma migrate deploy && npm run seed

      - name: Security audit (root)
        run: npm audit --audit-level=high || true

      - name: Security audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build frontends
        run: npm run build

      - name: Build Vercel bundle
        run: npm run build:vercel

  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assa
          POSTGRES_PASSWORD: assa
          POSTGRES_DB: assa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assa -d assa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://assa:assa@localhost:5432/assa
      JWT_SECRET: ci-test-secret-not-for-production
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run install:all
      - run: npx playwright install chromium --with-deps

      - name: Migrate and seed
        working-directory: backend
        run: npx prisma migrate deploy && npm run seed

      - name: Start API and frontends
        run: |
          npm run dev &
          npx wait-on -t 120000 http://localhost:4000/api/health http://localhost:3001/admin/ http://localhost:3002/fisher/ http://localhost:3003/market/

      - name: Run E2E demo spec
        run: npm run test:e2e
