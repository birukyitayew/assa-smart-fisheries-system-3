name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install module deps
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build frontends
        run: npm run build

