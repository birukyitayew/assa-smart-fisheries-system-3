services:
  - type: web
    name: assa-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: assa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 30m
      - key: REFRESH_TOKEN_DAYS
        value: 7

databases:
  - name: assa-db
    plan: free
    databaseName: assa
    user: assa
